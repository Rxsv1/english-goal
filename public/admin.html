<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Teacher · {{APP_NAME}}</title>
  <meta name="app-name" content="{{APP_NAME}}">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div class="page admin-page">
    <header class="appbar">
      <a class="brand" href="/"><img src="/icons/icon.svg" alt="">{{APP_NAME}} <span class="teacher-tag">Teacher</span></a>
      <div class="tools"><button id="logout" class="btn btn-ghost btn-sm" type="button" hidden>Log out</button></div>
    </header>
    <nav id="tabs" class="tabs" hidden aria-label="Admin sections">
      <a href="#/" data-tab="overview">📊 Overview</a>
      <a href="#/students" data-tab="students">👥 Students</a>
      <a href="#/lessons" data-tab="lessons">📚 Lessons</a>
    </nav>
    <main id="view" aria-busy="true">{{SKELETON}}</main>
  </div>

  <!-- Skeleton screens (see index.html). Same idea: painted from the first byte, cloned again while data loads. -->
  <template id="sk-tiles">
    <div class="head-row"><i class="sk sk-title sk-admin-title"></i><i class="sk sk-btn-sm sk-admin-btn"></i></div>
    <div class="tiles">
      <div class="tile-stat"><i class="sk sk-tile-v"></i><i class="sk sk-line w-70 sm"></i></div>
      <div class="tile-stat"><i class="sk sk-tile-v"></i><i class="sk sk-line w-70 sm"></i></div>
      <div class="tile-stat"><i class="sk sk-tile-v"></i><i class="sk sk-line w-70 sm"></i></div>
      <div class="tile-stat"><i class="sk sk-tile-v"></i><i class="sk sk-line w-70 sm"></i></div>
      <div class="tile-stat"><i class="sk sk-tile-v"></i><i class="sk sk-line w-70 sm"></i></div>
      <div class="tile-stat"><i class="sk sk-tile-v"></i><i class="sk sk-line w-70 sm"></i></div>
    </div>
    <div class="panel"><i class="sk sk-line w-50 lg"></i><div class="sk sk-chart"></div></div>
    <div class="panel"><i class="sk sk-line w-30 lg"></i><div class="sk-rows"><i class="sk sk-row"></i><i class="sk sk-row"></i><i class="sk sk-row"></i></div></div>
  </template>

  <template id="sk-list">
    <div class="head-row"><i class="sk sk-title sk-admin-title"></i><i class="sk sk-btn-sm sk-admin-btn"></i></div>
    <div class="sk sk-search"></div>
    <ul class="admin-list">
      <li class="admin-item sk-item"><i class="sk sk-avatar"></i><div class="info"><i class="sk sk-line w-50"></i><i class="sk sk-line w-90 sm"></i></div></li>
      <li class="admin-item sk-item"><i class="sk sk-avatar"></i><div class="info"><i class="sk sk-line w-50"></i><i class="sk sk-line w-90 sm"></i></div></li>
      <li class="admin-item sk-item"><i class="sk sk-avatar"></i><div class="info"><i class="sk sk-line w-50"></i><i class="sk sk-line w-90 sm"></i></div></li>
      <li class="admin-item sk-item"><i class="sk sk-avatar"></i><div class="info"><i class="sk sk-line w-50"></i><i class="sk sk-line w-90 sm"></i></div></li>
    </ul>
  </template>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/vendor/Sortable.min.js"></script>
  <script src="/grammar-core.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
